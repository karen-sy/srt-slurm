# low_latency_disagg.yaml
name: disagg_test_dep4x1_tep8x1
model:
  path: kimi-k25-nvfp4
  container: kimi-bench-trtllm
  precision: fp4

resources:
  gpu_type: gb200
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 4
  decode_nodes: 2
  decode_workers: 1  # currently profiling mode only supports 1 worker
  gpus_per_decode: 8
  gpus_per_node: 4
backend:
  type: trtllm
  prefill_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    TLLM_OVERRIDE_LAYER_NUM: '61'
    OTEL_EXPORT_ENABLED: "1"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    OTEL_SERVICE_NAME: "dynamo-prefill"
    DYN_LOGGING_JSONL: "1"
    
  decode_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    ENABLE_CONFIGURABLE_MOE: '1'
    TLLM_OVERRIDE_LAYER_NUM: '61'
    OTEL_EXPORT_ENABLED: "1"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    OTEL_SERVICE_NAME: "dynamo-decode"
    DYN_LOGGING_JSONL: "1"

  trtllm_config:
    prefill:
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 120000
      max_batch_size: 2
      max_num_tokens: 8192
      enable_chunked_prefill: true
      max_seq_len: 120000
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: false
      pipeline_parallel_size: 1
      print_iter_log: true
      trust_remote_code: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core
      kv_cache_config:
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.4
        dtype: fp8
        tokens_per_block: 32
      torch_compile_config:
        capture_num_tokens:
          - 1
          - 2
          - 4
          - 8
          - 16
          - 32
          - 64
          - 128
          - 256
          - 512
          - 768
          - 1024
          - 1280
          - 1536
          - 1792
          - 2048
          - 2304
          - 2560
          - 2816
          - 3072
          - 3328
          - 3584
          - 3840
          - 4096
          - 4352
          - 4608
          - 4864
          - 5120
          - 5376
          - 5632
          - 5888
          - 6144
          - 6400
          - 6656
          - 6912
          - 7168
          - 7424
          - 7680
          - 7936
          - 8192
        enable_piecewise_cuda_graph: true
        enable_userbuffers: false
        max_num_streams: 2
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        allow_advanced_sampling: true

    decode:
      allreduce_strategy: MNNVL
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 120000
      max_num_tokens: 4
      disable_overlap_scheduler: false
      enable_lm_head_tp_in_adp: false
      cuda_graph_config:
        batch_sizes:
        - 1
        enable_padding: true
      enable_attention_dp: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: true   
        free_gpu_memory_fraction: 0.75
      max_batch_size: 1
      max_seq_len: 120000
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core
      moe_expert_parallel_size: 8
      num_postprocess_workers: 4
      print_iter_log: true
      stream_interval: 100
      tensor_parallel_size: 8
      trust_remote_code: true

frontend:
  type: dynamo
  args:
    router-mode: round-robin
    router-reset-states: true
  enable_multiple_frontends: false
  env:
    DYN_LOGGING_JSONL: "1"
    OTEL_EXPORT_ENABLED: "1"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    OTEL_SERVICE_NAME: "dynamo-frontend"

health_check:
  max_attempts: 500
  interval_seconds: 10
  
dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: true

profiling:
  type: nsys-trace
  trace_file: traces/together-ai-basic-no-delays_119k/dataset.jsonl
  concurrency: 2
  prefill:
    start_step: 5
    stop_step: 55
  decode:
    start_step: 5
    stop_step: 55
