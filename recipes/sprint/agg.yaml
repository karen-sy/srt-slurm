# https://gitlab-master.nvidia.com/karenc/dynamo-workflows/-/blob/yunzhoul/add-slurm-instructions/slurm/trace-dataset/large-scale-best-config/agg.sh?ref_type=heads
name: agg-tep8
model:
  path: kimi-k25-nvfp4
  container: kimi-bench-trtllm
  precision: fp4
resources:
  gpu_type: gb200
  agg_nodes: 8
  agg_workers: 4
  gpus_per_agg: 8
  gpus_per_node: 4
backend:
  type: trtllm
  aggregated_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    ENROOT_ALLOW_DEV: 'yes'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    TRTLLM_FORCE_COMM_METHOD: NVLINK_TWO_SIDED
    ENABLE_CONFIGURABLE_MOE: '1'
    TLLM_OVERRIDE_LAYER_NUM: '61'
  trtllm_config:
    aggregated:
      # Attention chunking (enable_chunked_prefill) and MoE chunking
      # (moe_config.max_num_tokens) are separate TRT-LLM knobs.
      # This script is intended to test MoE-only chunking, so we disable
      # chunked prefill by default and expose a separate MoE chunk size.
      allreduce_strategy: MNNVL
      max_num_tokens: 148000
      enable_chunked_prefill: false
      # disable_overlap_scheduler: true
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        enable_padding: true
      enable_attention_dp: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.75
      #   tokens_per_block: 32
      max_batch_size: 16

      moe_config:
        backend: TRTLLM
        max_num_tokens: 2048

      moe_expert_parallel_size: 8
      num_postprocess_workers: 8
      print_iter_log: true
      stream_interval: 10
      tensor_parallel_size: 8
      trust_remote_code: true

      # Temporarily disabled knobs: 
      # max_seq_len: 240000
      # model_kwargs:
      #   num_hidden_layers: 61
      # torch_compile_config:
        # enable_piecewise_cuda_graph: true # temporarily disable piecewise cuda graph
        # capture_num_tokens: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096]

benchmark:
  type: trace-replay
  trace_file: traces/together-ai-basic-no-delays_119k/dataset.jsonl
  concurrencies: [16]  
  ttft_threshold_ms: 5000
  itl_threshold_ms: 20

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: round-robin
    router-reset-states: true
health_check:
  max_attempts: 500
  interval_seconds: 10
dynamo:
  install: false
