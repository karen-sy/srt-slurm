name: tep4_egl_prefill

model:
  path: "kimi-k25-nvfp4"
  subpath: "snapshots/e4e908c073784de20ad3af0be653421f1088922d"
  container: "kimi-bench-trtllm"
  precision: "fp4"
  speculative_model: "kimi-eagle"
  speculative_subpath: "snapshots/0b0c6ac039089ad2c2418c91c039553381a302d9"

slurm:
  time_limit: "00:30:00"

resources:
  gpu_type: "gb200"
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 4
  gpus_per_node: 4

backend:
  type: trtllm
  aggregated_environment:
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: "2"
  trtllm_config:
    aggregated:
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 120000
      max_batch_size: 2
      max_num_tokens: 8192
      enable_chunked_prefill: true
      max_seq_len: 120000
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: false
      pipeline_parallel_size: 1
      print_iter_log: true
      trust_remote_code: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core
      kv_cache_config:
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.7
        dtype: fp8
        tokens_per_block: 32
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        allow_advanced_sampling: true
        speculative_model_dir: /speculative-model

benchmark:
  type: "prefill"
  prefill_concurrencies: [2]
  prefill_dataset_dir: "together-ai-basic-no-delays_1osl/splits"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "round-robin"
    router-reset-states: true

health_check:
  max_attempts: 500
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: true

