name: tep4x7_dep32x1_conc32
model:
  path: kimi-k25-nvfp4
  container: kimi-bench-trtllm
  precision: fp4
  speculative_model: kimi-eagle
resources:
  gpu_type: gb200
  prefill_nodes: 7
  prefill_workers: 7
  gpus_per_prefill: 4
  decode_nodes: 8
  decode_workers: 1
  gpus_per_decode: 32
  gpus_per_node: 4
backend:
  type: trtllm
  prefill_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    ENROOT_ALLOW_DEV: 'yes'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    TLLM_OVERRIDE_LAYER_NUM: '61'
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2'
  decode_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    ENROOT_ALLOW_DEV: 'yes'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    TRTLLM_FORCE_COMM_METHOD: NVLINK_TWO_SIDED
    ENABLE_CONFIGURABLE_MOE: '1'
    TLLM_OVERRIDE_LAYER_NUM: '61'
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2'
  trtllm_config:
    prefill: # https://github.com/karen-sy/srt-slurm/blob/aflowers/prefill-benchmark/recipes/sprint/tep4_egl_prefill_batch2.yaml
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 120000
      max_batch_size: 2
      max_num_tokens: 8192
      enable_chunked_prefill: true
      max_seq_len: 120000
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: false
      pipeline_parallel_size: 1
      print_iter_log: true
      trust_remote_code: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core
      kv_cache_config:
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.7
        dtype: fp8
        tokens_per_block: 32
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        allow_advanced_sampling: true
        speculative_model_dir: /speculative-model

    decode:
      # load_format: DUMMY
      allreduce_strategy: AUTO
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 120000
      max_num_tokens: 4  # per rank
      disable_overlap_scheduler: false
      cuda_graph_config:
        batch_sizes:
        - 1
        enable_padding: true
      enable_attention_dp: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.75
        tokens_per_block: 32
      max_batch_size: 1
      max_seq_len: 120000
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cutedsl
        - cuda_core
        - cublaslt
      moe_expert_parallel_size: 32
      num_postprocess_workers: 8
      print_iter_log: true
      stream_interval: 100
      tensor_parallel_size: 32
      trust_remote_code: true
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        speculative_model_dir: /speculative-model
        allow_advanced_sampling: true

benchmark:
  type: trace-replay
  trace_file: traces/together-ai-basic-no-delays_119k/dataset.jsonl
  concurrencies: [32]  
  ttft_threshold_ms: 5000
  itl_threshold_ms: 20

frontend:
  type: dynamo
  args:
    router-mode: kv
    router-reset-states: true
  enable_multiple_frontends: false
health_check:
  max_attempts: 500
  interval_seconds: 10
  
dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: true